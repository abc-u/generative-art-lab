name: Daily lesson draft

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether a lesson is already waiting for review
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "has_open_pr=$(gh pr list --head automation/daily-lesson --state open --json number --jq 'length > 0')" >> "$GITHUB_OUTPUT"
      - name: Generate next lesson and run quality gates
        if: steps.pending.outputs.has_open_pr != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/generate_daily_lesson.py
      - name: Open or update the review pull request
        if: steps.pending.outputs.has_open_pr != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/daily-lesson
          delete-branch: true
          title: 'Add the next Generative Art Lab lesson'
          body: |
            Daily lesson draft generated by the scheduled workflow.

            The lesson and interactive demo passed the required structural and JavaScript syntax checks. Review Japanese explanations, calculations, citations, and the demo before merging. Merging to `main` publishes through the configured GitHub Pages branch source.
          commit-message: 'Add validated daily lesson draft'
