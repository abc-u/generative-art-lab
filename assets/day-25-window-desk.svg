<text x="646" y="225" font-family="sans-serif" font-size="20" fill="#29383d">マグ</text>
<path d="M310 89h300" stroke="#c28c4b" stroke-width="5" stroke-dasharray="10 8"/>
<text x="305" y="74" font-family="sans-serif" font-size="17" fill="#29383d">輪郭を拾う</text>
<text x="610" y="74" font-family="sans-serif" font-size="17" fill="#29383d">影を拾う</text>
<text x="42" y="395" font-family="sans-serif" font-size="16" fill="#fff">窓からの光で、同じ机にも位置ごとに異なる明暗が生まれる</text>
