<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
<title id="t">窓辺の机の上にあるノートとマグカップ</title>
<desc id="d">左側の窓から光が差し、机の上のノートとマグカップに明るい部分と影ができている。左から右へ、輪郭重視から暗さ重視へ描画の重みを変える例。</desc>
