<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d"><title id="t">余りを3で割ると三つの段階がくり返す</title><desc id="d">行と列の合計を3で割った余り0、1、2が格子状に斜めにくり返す。</desc><rect width="720" height="280" rx="8" fill="#f4f6f2"/><g font-family="sans-serif" fill="#303832"><text x="28" y="38" font-size="17" font-weight="700" fill="#4f8a5c">(row + col) % 3 の見え方</text><g transform="translate(48 66)" font-size="18" text-anchor="middle" font-weight="700"><g fill="#fff" stroke="#cbd7ce"><path d="M0 0h240v150H0zM0 50h240M0 100h240M60 0v150M120 0v150M180 0v150"/></g><g fill="#2f5f3f"><text x="30" y="32">0</text><text x="210" y="32">0</text><text x="150" y="82">0</text><text x="90" y="132">0</text></g><g fill="#cf684b"><text x="90" y="32">1</text><text x="30" y="82">1</text><text x="210" y="82">1</text><text x="150" y="132">1</text></g><g fill="#55605a"><text x="150" y="32">2</text><text x="90" y="82">2</text><text x="30" y="132">2</text><text x="210" y="132">2</text></g></g><g font-size="16"><text x="350" y="100">余り 0・1・2 で</text><text x="350" y="132">三つの形や色を</text><text x="350" y="164">順番に選ぶ。</text><text x="350" y="216" fill="#58645b">二つの形から三つへ。</text><text x="350" y="242" fill="#58645b">条件を一つ増やす発展です。</text></g></g></svg>
