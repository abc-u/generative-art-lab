<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">壁にマスキングテープを貼り、塗装範囲を区切る</title><desc id="d">壁の一部をテープで覆い、ローラーで色を塗る。テープの下には色が通らず、露出した部分だけに塗料がつく。</desc><rect width="900" height="430" rx="24" fill="#f4efe5"/><rect x="70" y="55" width="760" height="300" rx="8" fill="#e7e2d7" stroke="#b8ad9d" stroke-width="5"/><rect x="280" y="55" width="340" height="300" fill="#d5815e"/><path d="M262 55v300M638 55v300" stroke="#e3c273" stroke-width="22"/><path d="M248 55v300M652 55v300" stroke="#fff" stroke-width="3" stroke-dasharray="7 8"/><rect x="150" y="164" width="90" height="150" rx="18" fill="#b87956" transform="rotate(-22 195 240)"/><rect x="165" y="115" width="82" height="110" rx="24" fill="#d8e7e5" stroke="#637b7a" stroke-width="6" transform="rotate(-22 206 170)"/><rect x="179" y="92" width="70" height="26" rx="10" fill="#8ca6a3" transform="rotate(-22 214 105)"/><text x="95" y="386" font-family="sans-serif" font-size="18" fill="#29383d">テープが塗料を止め、塗る場所だけを通す</text></svg>