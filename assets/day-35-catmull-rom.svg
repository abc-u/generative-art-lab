<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">Catmull–Romスプラインはアンカーポイントを通る</title>
<desc id="desc">四つの点のうち中央の二点を結ぶ曲線を示し、両端の隣の点から接線を作る。曲線は中央のアンカーP1とP2を通る。</desc>
<rect width="760" height="330" rx="18" fill="#f4f2ea"/>
<path d="M80 220 C175 80 280 275 385 180" fill="none" stroke="#24776d" stroke-width="7" stroke-linecap="round"/>
<path d="M80 220 L265 150 L385 180 L570 70" fill="none" stroke="#bdc6bc" stroke-width="2" stroke-dasharray="8 7"/>
<path d="M80 220 L385 180 M265 150 L570 70" fill="none" stroke="#d87450" stroke-width="3" stroke-dasharray="5 5"/>
<circle cx="80" cy="220" r="9" fill="#d87450"/><circle cx="265" cy="150" r="11" fill="#24776d"/><circle cx="385" cy="180" r="11" fill="#24776d"/><circle cx="570" cy="70" r="9" fill="#d87450"/>
<g font-family="sans-serif" fill="#20343a"><text x="57" y="247" font-size="20">P₀</text><text x="242" y="132" font-size="20" font-weight="700">P₁</text><text x="374" y="212" font-size="20" font-weight="700">P₂</text><text x="575" y="67" font-size="20">P₃</text><text x="30" y="42" font-size="21" font-weight="700">前後の点から接線を見積もり、P₁からP₂への曲線を引く</text><text x="80" y="296" font-size="17">接線 m₁ = (P₂−P₀)/2</text><text x="385" y="296" font-size="17">接線 m₂ = (P₃−P₁)/2</text><text x="256" y="185" font-size="14" fill="#24776d">曲線が通る</text><text x="376" y="155" font-size="14" fill="#24776d">曲線が通る</text></g></svg>