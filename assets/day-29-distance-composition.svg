<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">二つの距離から形を合成</title><desc id="d">左から二円の合体、重なり、AからBを抜く演算を示す。円内の距離は負、外側は正。minとmaxで距離をまとめる。</desc><rect width="900" height="420" rx="24" fill="#f5f0e6"/><text x="28" y="45" font-family="sans-serif" font-size="26" fill="#29383d">二つの符号付き距離を組み合わせる</text><g transform="translate(42 92)"><text x="46" y="0" font-family="sans-serif" font-size="22">合体：min(dA,dB)</text><circle cx="88" cy="102" r="62" fill="#d05c43" opacity=".78"/><circle cx="158" cy="102" r="62" fill="#417786" opacity=".78"/><text x="62" y="185" font-family="sans-serif" font-size="18">AかBの内側</text></g><g transform="translate(335 92)"><text x="12" y="0" font-family="sans-serif" font-size="22">重なり：max(dA,dB)</text><circle cx="88" cy="102" r="62" fill="#e9ddd0"/><circle cx="158" cy="102" r="62" fill="#e9ddd0"/><path d="M123 50 A62 62 0 0 1 123 154 A62 62 0 0 1 123 50" fill="#aa725a"/><text x="42" y="185" font-family="sans-serif" font-size="18">両方の内側だけ</text></g><g transform="translate(632 92)"><text x="-6" y="0" font-family="sans-serif" font-size="22">型抜き：max(dA,−dB)</text><circle cx="88" cy="102" r="62" fill="#d05c43"/><circle cx="158" cy="102" r="62" fill="#f5f0e6"/><text x="35" y="185" font-family="sans-serif" font-size="18">AからBを引く</text></g><text x="34" y="365" font-family="sans-serif" font-size="19" fill="#29383d">円の内側 d&lt;0　｜　境界 d=0　｜　外側 d&gt;0</text><text x="34" y="395" font-family="sans-serif" font-size="18" fill="#53676c">合成距離 → ぼかしマスク → 基本確率へ掛ける</text></svg>