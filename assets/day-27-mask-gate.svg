<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">手描きマスクを確率の許可率として使う</title><desc id="d">マスクが黒なら確率は0となり筆跡を描かない。灰色は特徴から求めた確率を半分ほど通す。白は特徴の確率をそのまま通す。</desc><rect width="900" height="330" rx="24" fill="#f5f1e8"/><text x="40" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#29383d">マスクは「描いてよい確率」を決める</text><rect x="52" y="85" width="230" height="90" rx="12" fill="#1e2526"/><text x="74" y="122" font-family="sans-serif" font-size="19" fill="#fff">黒 mask=0</text><text x="74" y="152" font-family="sans-serif" font-size="16" fill="#fff">通さない</text><rect x="335" y="85" width="230" height="90" rx="12" fill="#aaa"/><text x="357" y="122" font-family="sans-serif" font-size="19" fill="#20292b">灰 mask≈0.5</text><text x="357" y="152" font-family="sans-serif" font-size="16" fill="#20292b">確率を半分通す</text><rect x="618" y="85" width="230" height="90" rx="12" fill="#fff" stroke="#bbb"/><text x="640" y="122" font-family="sans-serif" font-size="19" fill="#20292b">白 mask=1</text><text x="640" y="152" font-family="sans-serif" font-size="16" fill="#20292b">そのまま通す</text><rect x="52" y="210" width="796" height="72" rx="14" fill="#fff"/><text x="75" y="242" font-family="sans-serif" font-size="18" fill="#29383d">最終確率 p = mask × (α×暗さ + (1−α)×輪郭)</text><text x="75" y="267" font-family="sans-serif" font-size="16" fill="#52666a">特徴で候補を選び、マスクで場所を通す・弱める・止める</text></svg>