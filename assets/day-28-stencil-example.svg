<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">楕円の型紙で塗る範囲を決める</title><desc id="d">紙に重ねた型紙の楕円の穴から赤い塗料が紙に付き、覆われた部分には付かない。</desc><rect width="720" height="420" rx="24" fill="#f5f0e6"/><rect x="78" y="100" width="565" height="250" rx="12" fill="#fff" stroke="#c9c2b6" stroke-width="4"/><ellipse cx="360" cy="225" rx="175" ry="87" fill="#d96049"/><path d="M78 110 Q145 88 225 128 L250 165 Q248 185 230 202 Q235 226 220 246 Q233 275 210 299 Q190 324 78 341Z" fill="#4b7180"/><path d="M642 110 Q565 85 488 125 L472 164 Q474 188 489 203 Q480 230 496 249 Q484 278 512 304 Q535 328 642 341Z" fill="#4b7180"/><path d="M120 82 L210 118 M510 82 L600 118" stroke="#c2543d" stroke-width="12" stroke-linecap="round"/><text x="253" y="221" font-size="22" font-family="sans-serif" fill="white">穴：色を通す</text><text x="95" y="374" font-size="18" font-family="sans-serif" fill="#29383d">青い型紙：色を止める</text><text x="455" y="374" font-size="18" font-family="sans-serif" fill="#29383d">赤：紙に付いた色</text></svg>