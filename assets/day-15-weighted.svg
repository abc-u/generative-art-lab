<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">重み付き抽選で領域を選ぶ</title><desc id="d">左・中央・右の重みを1、4、1にして、中央を3分の2の確率で選ぶ図。</desc><rect width="720" height="300" rx="20" fill="#f7f1e6"/><text x="32" y="48" font-family="sans-serif" font-size="23" fill="#303832">重み 1 : 4 : 1 → 中央は 4/6 の確率</text><rect x="42" y="95" width="200" height="130" fill="#d9e4dc" stroke="#56685c" stroke-width="2"/><rect x="242" y="95" width="200" height="130" fill="#e8a47e" stroke="#56685c" stroke-width="2"/><rect x="442" y="95" width="200" height="130" fill="#d9e4dc" stroke="#56685c" stroke-width="2"/><text x="119" y="166" font-family="sans-serif" font-size="24" fill="#303832">左 1</text><text x="307" y="166" font-family="sans-serif" font-size="24" fill="#303832">中央 4</text><text x="519" y="166" font-family="sans-serif" font-size="24" fill="#303832">右 1</text><text x="42" y="263" font-family="sans-serif" font-size="17" fill="#59665c">くじ r×6=3.2 → 累積重み1より大、5以下 → 中央を選ぶ</text></svg>