<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d"><title id="t">一歩で形が切り替わる</title><desc id="d">右か下へ一マス進むたび形が切り替わり、二回進むと元の形に戻る。</desc><rect width="720" height="340" rx="8" fill="#f4f6f2"/><g font-family="sans-serif" fill="#303832"><text x="28" y="38" font-size="17" font-weight="700" fill="#4f8a5c">右か下へ一歩で、形が切り替わる</text><g transform="translate(58 78)"><rect width="220" height="220" fill="#fff" stroke="#cbd7ce"/><path d="M110 0v220M0 110h220" stroke="#cbd7ce"/><rect x="2" y="2" width="106" height="106" fill="#e5eee5"/><rect x="112" y="112" width="106" height="106" fill="#e5eee5"/><circle cx="55" cy="55" r="22" fill="#cf684b"/><rect x="133" y="23" width="64" height="64" fill="#4c6854"/><rect x="23" y="133" width="64" height="64" fill="#4c6854"/><circle cx="165" cy="165" r="22" fill="#cf684b"/><path d="M72 55h55M118 48l10 7-10 7M55 72v55M48 118l7 10 7-10" fill="none" stroke="#263a2b" stroke-width="3"/></g><g font-size="16"><text x="335" y="112">右へ1マス → 合計 +1</text><text x="335" y="145">偶数 ↔ 奇数 → 形が変わる</text><text x="335" y="210">右と下へ進む → 合計 +2</text><text x="335" y="243">偶数のまま → 元の形に戻る</text></g></g></svg>
