<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-labelledby="title desc"><title id="title">輪郭の強さを筆跡の密度に変える</title><desc id="desc">勾配強さ0では採用確率10パーセント、90では50パーセント、180以上では90パーセントとなり、強い境界ほど線が多くなる。</desc><rect width="920" height="330" rx="22" fill="#f6f3e9"/><text x="42" y="48" font-family="sans-serif" font-size="24" font-weight="700" fill="#293d43">明るさの差 m</text><text x="880" y="48" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="700" fill="#293d43">採用確率 p</text><g font-family="sans-serif" font-size="17" fill="#465b60"><text x="120" y="90">m = 0</text><text x="410" y="90">m = 90</text><text x="700" y="90">m ≥ 180</text></g><path d="M100 112 H810" stroke="#d4d1c6" stroke-width="4"/><circle cx="125" cy="112" r="10" fill="#4d8b91"/><circle cx="440" cy="112" r="10" fill="#4d8b91"/><circle cx="760" cy="112" r="10" fill="#4d8b91"/><g fill="#d9e7e0"><rect x="70" y="145" width="250" height="115" rx="12"/><rect x="335" y="145" width="250" height="115" rx="12"/><rect x="600" y="145" width="250" height="115" rx="12"/></g><g stroke="#276574" stroke-width="6" stroke-linecap="round"><path d="M120 195 h42"/><path d="M210 220 h42"/><path d="M370 183 h32"/><path d="M416 214 h32"/><path d="M462 183 h32"/><path d="M508 214 h32"/><path d="M632 178 h20"/><path d="M668 202 h20"/><path d="M704 226 h20"/><path d="M740 178 h20"/><path d="M776 202 h20"/><path d="M812 226 h20"/></g><g font-family="sans-serif" font-size="18" font-weight="700" fill="#293d43" text-anchor="middle"><text x="195" y="290">p = 10% · 少なめ</text><text x="460" y="290">p = 50% · 中間</text><text x="725" y="290">p = 90% · 多め</text></g><text x="460" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52666a">p = 0.10 + (0.90 − 0.10) × min(m ÷ 180, 1)　｜　候補位置は面から一様に選ぶ</text></svg>