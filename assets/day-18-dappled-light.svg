<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d"><title id="t">木漏れ日の下の地面の明暗</title><desc id="d">木陰は暗く、光が当たる場所は明るい公園の地面を表した模式図。</desc><rect width="720" height="280" rx="18" fill="#f4f0e6"/><text x="28" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#293c39">身近な例：木漏れ日が作る地面の明暗</text><rect x="38" y="60" width="420" height="185" rx="12" fill="#e8d9b5"/><circle cx="230" cy="100" r="48" fill="#6e8e5b"/><rect x="220" y="105" width="20" height="70" fill="#775d42"/><ellipse cx="230" cy="189" rx="90" ry="35" fill="#899276" opacity=".85"/><circle cx="115" cy="101" r="30" fill="#fff1bd"/><circle cx="350" cy="210" r="25" fill="#fff1bd"/><text x="495" y="105" font-family="sans-serif" font-size="16" fill="#293c39">暗い木陰と明るい日なた</text><text x="495" y="140" font-family="sans-serif" font-size="14" fill="#48544b">明るさの差を画像に写せます。</text><text x="495" y="190" font-family="sans-serif" font-size="13" fill="#48544b">図は光の状態を示す模式図です。</text></svg>