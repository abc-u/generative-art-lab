<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">明るさを点の採用確率へ変える流れ</title><desc id="d">候補位置の白黒ピクセルを読み、暗いほど高い確率で点を採用する図。</desc><rect width="720" height="300" rx="18" fill="#f4f0e6"/><text x="28" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#293c39">画像の明るさを採用確率に置き換える</text><rect x="40" y="70" width="230" height="165" fill="#eee" stroke="#68756a"/><circle cx="154" cy="150" r="52" fill="#444"/><circle cx="154" cy="150" r="25" fill="#222"/><text x="42" y="260" font-family="sans-serif" font-size="14" fill="#48544b">暗い所ほど点を残しやすい</text><path d="M300 150h54" stroke="#68756a" stroke-width="3"/><path d="m345 141 12 9-12 9" fill="none" stroke="#68756a" stroke-width="3"/><text x="378" y="102" font-family="sans-serif" font-size="16" fill="#293c39">明るさ 0〜255</text><text x="378" y="137" font-family="sans-serif" font-size="16" fill="#293c39">p = 1 − 明るさ ÷ 255</text><text x="378" y="180" font-family="sans-serif" font-size="16" fill="#293c39">乱数 r &lt; p なら点を描く</text><text x="378" y="228" font-family="sans-serif" font-size="14" fill="#205d51">暗い部分の点が増え、画像の形が浮かぶ</text></svg>