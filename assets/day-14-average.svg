<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">乱数を平均して中央に寄せる</title><desc id="desc">二つの一様乱数の平均を取り、0.5に近い値が出やすくなる図。</desc><rect width="720" height="340" rx="24" fill="#f7f1e6"/><text x="36" y="54" font-family="sans-serif" font-size="25" font-weight="700" fill="#303832">一様乱数を2つ平均すると、中央が選ばれやすい</text><text x="44" y="112" font-family="sans-serif" font-size="20" fill="#303832">0.2</text><text x="124" y="112" font-family="sans-serif" font-size="20" fill="#303832">＋</text><text x="176" y="112" font-family="sans-serif" font-size="20" fill="#303832">0.8</text><text x="244" y="112" font-family="sans-serif" font-size="20" fill="#303832">÷ 2</text><path d="M315 104h72" stroke="#586c62" stroke-width="3"/><path d="m376 96 12 8-12 8" fill="none" stroke="#586c62" stroke-width="3"/><circle cx="443" cy="103" r="23" fill="#d8714d"/><text x="481" y="111" font-family="sans-serif" font-size="23" fill="#303832">0.5</text><text x="36" y="173" font-family="sans-serif" font-size="16" fill="#59665c">0</text><text x="655" y="173" font-family="sans-serif" font-size="16" fill="#59665c">1</text><path d="M56 180H664" stroke="#8d9a8e" stroke-width="3"/><path d="M56 180l150 90 152-90 152 90 154-90" fill="none" stroke="#3d7785" stroke-width="5" stroke-linejoin="round"/><path d="M56 180V280M208 270v10M360 180v100M512 270v10M664 180v100" stroke="#9eaa9c" stroke-width="2"/><text x="48" y="314" font-family="sans-serif" font-size="15" fill="#59665c">端になる組合せは少ない</text><text x="430" y="314" font-family="sans-serif" font-size="15" fill="#59665c">中央になる組合せは多い</text></svg>