<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d"><title id="t">木陰に集まる人</title><desc id="d">公園の木の下に人が集まり、日なたには少ない様子を描いた模式図。</desc><rect width="720" height="400" rx="20" fill="#edf0df"/><rect y="280" width="720" height="120" fill="#d8cba9"/><path d="M340 280V140h40v140z" fill="#70523b"/><circle cx="360" cy="118" r="105" fill="#718a63"/><circle cx="282" cy="144" r="65" fill="#809a70"/><circle cx="430" cy="145" r="65" fill="#667d58"/><g fill="#435b75"><circle cx="311" cy="264" r="16"/><path d="M296 282h30l10 50h-50z"/><circle cx="361" cy="258" r="16"/><path d="M346 276h30l10 56h-50z"/><circle cx="411" cy="265" r="16"/><path d="M396 283h30l10 49h-50z"/></g><text x="38" y="48" font-family="sans-serif" font-size="24" fill="#303832">暑い日は、日なたより木陰が選ばれやすい</text><text x="42" y="370" font-family="sans-serif" font-size="15" fill="#58675e">身近な例の模式図 · 実際の人の動きは状況によって変わります</text></svg>