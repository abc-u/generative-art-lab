<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="t d"><title id="t">普通のminとsmooth minの形の違い</title><desc id="d">隙間のある二円を普通のminでは別々に残し、smooth minでは中間の距離を少し内側へ押して橋を作る。</desc><rect width="900" height="410" rx="24" fill="#f5f0e6"/><text x="30" y="48" font-family="sans-serif" font-size="26" fill="#29383d">距離を混ぜると、二つの円の間に橋ができる</text><g transform="translate(58 95)"><text x="28" y="0" font-family="sans-serif" font-size="22">普通のmin（k=0）</text><circle cx="110" cy="130" r="68" fill="#75989a"/><circle cx="260" cy="130" r="68" fill="#75989a"/><path d="M160 170 Q185 182 210 170" fill="none" stroke="#c2543d" stroke-width="5" stroke-dasharray="7 7"/><text x="92" y="245" font-family="sans-serif" font-size="18">間の距離は外側のまま</text></g><g transform="translate(480 95)"><text x="23" y="0" font-family="sans-serif" font-size="22">smooth min（k=40）</text><circle cx="110" cy="130" r="68" fill="#75989a"/><circle cx="260" cy="130" r="68" fill="#75989a"/><path d="M160 89 C178 97 192 97 210 89 L210 171 C192 163 178 163 160 171Z" fill="#75989a"/><path d="M160 170 Q185 182 210 170" fill="none" stroke="#c2543d" stroke-width="3"/><text x="80" y="245" font-family="sans-serif" font-size="18">距離を混ぜて橋を作る</text></g><text x="32" y="375" font-family="sans-serif" font-size="19" fill="#29383d">差がk以上：普通のmin　｜　差がk未満：境界の近くを混ぜる</text></svg>