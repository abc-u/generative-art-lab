<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d"><title id="t">場所で当たりやすさが違うくじのたとえ</title><desc id="d">左の箱には当たりくじが多く右に行くほど少なく、候補ごとに当たりやすさが変化する。</desc><rect width="720" height="280" rx="18" fill="#f4f0e6"/><text x="28" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#293c39">場所ごとに「当たりやすさ」が違うくじ</text><g font-family="sans-serif"><rect x="38" y="66" width="200" height="150" rx="10" fill="#d8eadf"/><rect x="260" y="66" width="200" height="150" rx="10" fill="#e9e4d5"/><rect x="482" y="66" width="200" height="150" rx="10" fill="#eee8dd"/><text x="70" y="96" font-size="16" font-weight="700" fill="#293c39">左：当たりやすい</text><text x="300" y="96" font-size="16" font-weight="700" fill="#293c39">中央：半々</text><text x="523" y="96" font-size="16" font-weight="700" fill="#293c39">右：当たりにくい</text><text x="90" y="164" font-size="30" fill="#237a67">● ● ● ○</text><text x="312" y="164" font-size="30" fill="#237a67">● ○ ● ○</text><text x="535" y="164" font-size="30" fill="#237a67">○ ○ ● ○</text><text x="67" y="244" font-size="14" fill="#48544b">候補の場所を見てから、確率で採用を決める</text></g></svg>