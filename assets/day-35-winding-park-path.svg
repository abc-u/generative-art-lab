<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">公園の園路を通過点に沿って曲げる模式図</title><desc id="desc">公園の緑地にある曲がりくねった道が、五つの地点を通ってなめらかに続く。通過点は丸い印で表示。</desc>
<rect width="760" height="330" rx="18" fill="#ecf0df"/><path d="M34 276 C135 262 112 111 242 111 C366 111 334 260 453 250 C557 241 538 78 719 63" fill="none" stroke="#73836a" stroke-width="40" stroke-linecap="round"/><path d="M34 276 C135 262 112 111 242 111 C366 111 334 260 453 250 C557 241 538 78 719 63" fill="none" stroke="#e4d8b7" stroke-width="31" stroke-linecap="round"/><g fill="#5b8b66" opacity=".8"><circle cx="92" cy="99" r="35"/><circle cx="168" cy="54" r="25"/><circle cx="304" cy="60" r="33"/><circle cx="380" cy="78" r="24"/><circle cx="603" cy="166" r="33"/><circle cx="658" cy="235" r="26"/></g><g fill="#dd7452" stroke="#fff" stroke-width="4"><circle cx="34" cy="276" r="10"/><circle cx="155" cy="111" r="10"/><circle cx="357" cy="206" r="10"/><circle cx="537" cy="221" r="10"/><circle cx="719" cy="63" r="10"/></g><g font-family="sans-serif" fill="#20343a"><text x="28" y="37" font-size="21" font-weight="700">園路の通過地点を置くと、その点を通る道筋を描ける</text><text x="32" y="310" font-size="16">丸い点＝通りたい場所 ／ 道＝Catmull–Rom曲線のイメージ</text></g></svg>