<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">確率マスクで点を選ぶ流れ</title><desc id="d">一様に候補を作り、場所ごとの採用確率と乱数を比べて、採用点を残す。</desc><rect width="720" height="300" rx="18" fill="#f4f0e6"/><text x="28" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#293c39">確率マスク：場所ごとに採用率を変える</text><rect x="36" y="65" width="265" height="190" rx="8" fill="#e7e1d3" stroke="#77877a" stroke-width="2"/><path d="M40 70h255v180H40z" fill="url(#g)"/><defs><linearGradient id="g"><stop stop-color="#328c74" stop-opacity=".72"/><stop offset="1" stop-color="#328c74" stop-opacity=".06"/></linearGradient></defs><g fill="#287a66"><circle cx="79" cy="105" r="5"/><circle cx="118" cy="134" r="5"/><circle cx="54" cy="199" r="5"/><circle cx="161" cy="212" r="5"/></g><g fill="#bf6750"><circle cx="250" cy="98" r="5"/><circle cx="211" cy="183" r="5"/></g><text x="41" y="279" font-family="sans-serif" font-size="14" fill="#48544b">緑＝採用　赤＝不採用　左ほど採用確率が高い</text><text x="339" y="104" font-family="sans-serif" font-size="16" font-weight="700" fill="#293c39">候補ごとに確率 p を計算</text><text x="339" y="135" font-family="sans-serif" font-size="14" fill="#48544b">左→右の例：p = 1 − x ÷ 幅</text><text x="339" y="179" font-family="sans-serif" font-size="16" font-weight="700" fill="#293c39">新しい乱数 r と比べる</text><text x="339" y="210" font-family="sans-serif" font-size="14" fill="#48544b">r &lt; p なら採用、そうでなければ捨てる</text><text x="339" y="254" font-family="sans-serif" font-size="14" fill="#205d51">判定の肝：場所の確率と乱数の大小比較</text></svg>