<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="t d"><title id="t">勾配の強さを筆の長さへ変える</title><desc id="d">勾配0では線長24ピクセル、勾配90では15ピクセル、勾配180以上では6ピクセルになる関係を示す。</desc><rect width="920" height="310" rx="22" fill="#f7f3e9"/><text x="42" y="54" font-family="sans-serif" font-size="25" font-weight="700" fill="#283b42">明るさの変化がゆるやか → 長い筆</text><text x="878" y="54" text-anchor="end" font-family="sans-serif" font-size="25" font-weight="700" fill="#283b42">急な境界 → 短い筆</text><path d="M90 100 C150 92 210 108 270 100 S390 92 450 100" fill="none" stroke="#b8d2cc" stroke-width="34" opacity=".65"/><path d="M470 100 L470 250" stroke="#263f4b" stroke-width="3" stroke-dasharray="7 7"/><path d="M500 100 L840 100" stroke="#d97e4d" stroke-width="34" opacity=".25"/><g stroke="#275a68" stroke-width="6" stroke-linecap="round"><path d="M122 152 H146"/><path d="M190 152 H214"/><path d="M258 152 H282"/><path d="M326 152 H350"/><path d="M394 152 H418"/></g><g stroke="#a8553c" stroke-width="6" stroke-linecap="round"><path d="M540 152 H555"/><path d="M600 152 H615"/><path d="M660 152 H675"/><path d="M720 152 H735"/><path d="M780 152 H795"/></g><text x="270" y="206" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#283b42">なだらかな場所：長い線が残る</text><text x="670" y="206" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#283b42">明暗の境界：短い線で細部を保つ</text><text x="270" y="253" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#52656a">m = 0 → 24 px</text><text x="670" y="253" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#52656a">m ≥ 180 → 6 px</text><text x="460" y="290" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#52656a">中間の強さ m = 90 → 15 px　｜　L = 6 + (24 − 6) × (1 − min(m ÷ 180, 1))</text></svg>