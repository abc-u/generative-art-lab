<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="t d"><title id="t">明るさ確率と勾配強度を掛け合わせる</title><desc id="d">暗さの確率と勾配の強さを掛け、両方が高い場所ほど採用確率を高くする。</desc><rect width="920" height="350" rx="22" fill="#f7f3e9"/><text x="42" y="47" font-family="sans-serif" font-size="24" font-weight="700" fill="#293d43">画素の暗さ p暗</text><text x="878" y="47" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="700" fill="#293d43">勾配の強さ s</text><text x="460" y="47" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#b25f43">掛け算 → 採用確率 p</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="78" width="250" height="230" rx="15" fill="#e6e9e1"/><rect x="335" y="78" width="250" height="230" rx="15" fill="#dce9e4"/><rect x="625" y="78" width="250" height="230" rx="15" fill="#f2e3d7"/><text x="170" y="111" font-size="20" font-weight="700" fill="#293d43">暗くても平坦</text><text x="460" y="111" font-size="20" font-weight="700" fill="#293d43">暗くて境界も強い</text><text x="750" y="111" font-size="20" font-weight="700" fill="#293d43">明るいが境界は強い</text><text x="170" y="147" font-size="17" fill="#40575d">p暗=.65　s=0</text><text x="460" y="147" font-size="17" fill="#40575d">p暗=.65　s=.80</text><text x="750" y="147" font-size="17" fill="#40575d">p暗=.15　s=.80</text><text x="170" y="188" font-size="25" font-weight="700" fill="#b25f43">p = 0</text><text x="460" y="188" font-size="25" font-weight="700" fill="#b25f43">p = .52</text><text x="750" y="188" font-size="25" font-weight="700" fill="#b25f43">p = .12</text></g><g fill="#276574"><circle cx="106" cy="230" r="4"/><circle cx="174" cy="258" r="4"/><circle cx="235" cy="224" r="4"/><circle cx="379" cy="225" r="4"/><circle cx="409" cy="252" r="4"/><circle cx="441" cy="224" r="4"/><circle cx="473" cy="252" r="4"/><circle cx="505" cy="224" r="4"/><circle cx="537" cy="252" r="4"/><circle cx="675" cy="230" r="4"/><circle cx="735" cy="255" r="4"/><circle cx="800" cy="227" r="4"/></g><text x="460" y="337" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#52666a">p = p暗 × s　｜　p暗 = 1 − gray ÷ 255　｜　s = min(m ÷ 180, 1)</text></svg>