<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">窓辺のりんごを鉛筆で描くときの筆跡</title><desc id="d">りんごの濃い影と外形の境界に短い線が集まり、明るく平坦な面には線が少ない模式図。</desc><rect width="900" height="440" rx="24" fill="#f5f0e6"/><path d="M80 82H820V350H80Z" fill="#e8dfcd"/><circle cx="681" cy="138" r="48" fill="#f7e6a8" opacity=".75"/><path d="M110 322 Q270 285 440 322 T790 322" fill="none" stroke="#9b8c72" stroke-width="5"/><path d="M324 177 C277 144 228 185 241 248 C253 304 294 322 360 322 C426 322 469 302 482 248 C495 185 448 144 398 177 C375 191 347 190 324 177Z" fill="#bd6b51"/><path d="M360 178 Q370 151 376 129" stroke="#514638" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M378 142 Q410 120 435 132 Q414 158 382 157Z" fill="#71866a"/><path d="M420 187 C461 198 470 233 457 266 C446 291 422 304 394 309 C426 280 422 222 420 187Z" fill="#694b42" opacity=".83"/><g stroke="#f4d1a2" stroke-width="6" stroke-linecap="round"><path d="M287 220l14 9"/><path d="M307 243l13 9"/><path d="M328 261l12 9"/><path d="M344 284l12 8"/><path d="M408 197l8 5"/><path d="M427 211l9 5"/><path d="M443 229l8 5"/><path d="M440 252l9 5"/><path d="M425 275l9 5"/></g><g stroke="#334d55" stroke-width="5" stroke-linecap="round"><path d="M247 205l-9 13"/><path d="M253 187l-9 10"/><path d="M270 173l-9 8"/><path d="M298 163l-7 6"/><path d="M333 159l-5 5"/><path d="M370 160l-2 6"/><path d="M405 161l5 5"/><path d="M448 174l8 8"/><path d="M469 196l7 12"/></g><text x="235" y="115" font-family="sans-serif" font-size="22" font-weight="700" fill="#344d55">明るくなめらか：筆跡は少なめ</text><text x="605" y="298" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">暗い影と輪郭：筆跡が集まる</text><text x="450" y="395" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#485d62">暗さと明暗の境界、両方を手がかりに鉛筆の描き込みを増やす</text></svg>