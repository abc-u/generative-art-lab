<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">壁に落ちる影と線の長さ</title><desc id="d">均一に明るい壁では長い横線、影との境界付近では短い線を置く対応を示す模式図。</desc><rect width="900" height="430" rx="24" fill="#f6f0e5"/><rect x="48" y="66" width="804" height="286" rx="10" fill="#f7e7c9"/><path d="M510 66 H852 V352 H510 C475 300 485 238 510 190 C535 143 532 100 510 66Z" fill="#84949a" opacity=".72"/><path d="M510 66 C535 100 535 143 510 190 C485 238 475 300 510 352" fill="none" stroke="#354c55" stroke-width="5"/><text x="265" y="105" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#354c55">明るさがほぼ一定</text><text x="675" y="105" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">影の内側</text><g stroke="#236170" stroke-width="7" stroke-linecap="round"><path d="M120 160 H190"/><path d="M230 160 H300"/><path d="M340 160 H410"/><path d="M120 220 H190"/><path d="M230 220 H300"/><path d="M340 220 H410"/><path d="M120 280 H190"/><path d="M230 280 H300"/><path d="M340 280 H410"/></g><g stroke="#ad563c" stroke-width="7" stroke-linecap="round"><path d="M474 165 H491"/><path d="M473 222 H490"/><path d="M477 279 H494"/><path d="M535 165 H552"/><path d="M535 222 H552"/><path d="M535 279 H552"/></g><text x="270" y="391" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#354c55">長めの筆跡でなめらかさを表す</text><text x="640" y="391" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#354c55">短めの筆跡で境目を残す</text></svg>