<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="t d"><title id="t">暗さと輪郭の確率を重み付き平均で混ぜる</title><desc id="d">重みαを0にすると勾配の強さを優先し、100パーセントにすると暗さを優先する。65パーセントでは両方を混ぜる。</desc><rect width="920" height="340" rx="22" fill="#f7f3e9"/><text x="42" y="50" font-family="sans-serif" font-size="25" font-weight="700" fill="#293d43">暗さの確率 p暗</text><text x="878" y="50" text-anchor="end" font-family="sans-serif" font-size="25" font-weight="700" fill="#293d43">勾配の強さ s</text><text x="460" y="50" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#b15f43">重み α で平均する</text><path d="M110 105 H810" stroke="#d3d0c7" stroke-width="5"/><g fill="#3d7d83"><circle cx="150" cy="105" r="10"/><circle cx="460" cy="105" r="10"/><circle cx="770" cy="105" r="10"/></g><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="140" width="260" height="130" rx="14" fill="#dce7e1"/><rect x="330" y="140" width="260" height="130" rx="14" fill="#e9e4d6"/><rect x="615" y="140" width="260" height="130" rx="14" fill="#eadbd2"/><text x="175" y="176" font-size="21" font-weight="700" fill="#293d43">α = 0%</text><text x="460" y="176" font-size="21" font-weight="700" fill="#293d43">α = 65%</text><text x="745" y="176" font-size="21" font-weight="700" fill="#293d43">α = 100%</text><text x="175" y="211" font-size="17" fill="#42585d">輪郭 s をそのまま使う</text><text x="460" y="211" font-size="17" fill="#42585d">暗さと輪郭を混ぜる</text><text x="745" y="211" font-size="17" fill="#42585d">暗さ p暗 をそのまま使う</text><text x="175" y="246" font-size="16" fill="#42585d">p = s</text><text x="460" y="246" font-size="16" fill="#42585d">p = .65p暗 + .35s</text><text x="745" y="246" font-size="16" fill="#42585d">p = p暗</text></g><text x="460" y="310" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#52666a">p = α × p暗 + (1 − α) × s　｜　αは0〜1　｜　候補を採る条件は乱数 r &lt; p</text></svg>