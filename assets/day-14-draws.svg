<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">乱数をくじ引きにたとえる</title><desc id="desc">二つのくじの数を足して平均すると、中ほどの値が出やすくなる。</desc><rect width="720" height="300" rx="24" fill="#f7f1e6"/><text x="36" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#303832">くじを2回引き、その平均を場所にする</text><rect x="46" y="92" width="175" height="118" rx="14" fill="#fff" stroke="#bdc8bc" stroke-width="2"/><text x="71" y="126" font-family="sans-serif" font-size="17" fill="#58675e">1回目</text><text x="71" y="170" font-family="sans-serif" font-size="25" font-weight="700" fill="#3d7785">0.2</text><text x="152" y="170" font-family="sans-serif" font-size="24" fill="#303832">＋</text><rect x="248" y="92" width="175" height="118" rx="14" fill="#fff" stroke="#bdc8bc" stroke-width="2"/><text x="273" y="126" font-family="sans-serif" font-size="17" fill="#58675e">2回目</text><text x="273" y="170" font-family="sans-serif" font-size="25" font-weight="700" fill="#3d7785">0.8</text><path d="M444 150h70" stroke="#58675e" stroke-width="3"/><path d="m502 141 12 9-12 9" fill="none" stroke="#58675e" stroke-width="3"/><circle cx="582" cy="150" r="41" fill="#d8714d"/><text x="557" y="158" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">0.5</text><text x="47" y="254" font-family="sans-serif" font-size="16" fill="#58675e">一方が小さく、もう一方が大きい組も平均すると中央へ</text></svg>