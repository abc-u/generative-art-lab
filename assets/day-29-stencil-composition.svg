<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">二つの丸穴の型紙で塗り分け</title><desc id="d">合体、重なり部分、片方から型抜きした結果を三枚の紙に示したオリジナル図。</desc><rect width="900" height="430" rx="24" fill="#f5f0e6"/><text x="32" y="50" font-family="sans-serif" font-size="26" fill="#29383d">丸い型紙を重ねると、塗る範囲を選べる</text><g transform="translate(40 92)"><rect width="245" height="270" rx="14" fill="white" stroke="#c8c1b5" stroke-width="3"/><circle cx="96" cy="118" r="68" fill="#d05c43" opacity=".85"/><circle cx="155" cy="118" r="68" fill="#417786" opacity=".85"/><text x="67" y="220" font-family="sans-serif" font-size="22">合体</text><text x="35" y="250" font-family="sans-serif" font-size="17">どちらかの穴を塗る</text></g><g transform="translate(328 92)"><rect width="245" height="270" rx="14" fill="white" stroke="#c8c1b5" stroke-width="3"/><circle cx="96" cy="118" r="68" fill="#eee7d9"/><circle cx="155" cy="118" r="68" fill="#eee7d9"/><path d="M125 58 A68 68 0 0 1 125 178 A68 68 0 0 1 125 58" fill="#b2775a"/><text x="66" y="220" font-family="sans-serif" font-size="22">重なり</text><text x="30" y="250" font-family="sans-serif" font-size="17">両方の穴だけ塗る</text></g><g transform="translate(616 92)"><rect width="245" height="270" rx="14" fill="white" stroke="#c8c1b5" stroke-width="3"/><circle cx="96" cy="118" r="68" fill="#d05c43"/><circle cx="155" cy="118" r="68" fill="#fff" stroke="#c8c1b5" stroke-width="2"/><text x="48" y="220" font-family="sans-serif" font-size="22">AからBを抜く</text><text x="29" y="250" font-family="sans-serif" font-size="17">Aのうち重なりは残さない</text></g><text x="33" y="400" font-family="sans-serif" font-size="18" fill="#53676c">自作図：二つの丸穴を重ねたときの塗装範囲の例</text></svg>