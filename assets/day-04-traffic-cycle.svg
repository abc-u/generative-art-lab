<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260"><rect width="640" height="260" rx="18" fill="#f4f0e6"/><rect x="65" y="45" width="120" height="160" rx="18" fill="#303832"/><circle cx="125" cy="82" r="22" fill="#cf684b"/><circle cx="125" cy="125" r="22" fill="#e0ac4e"/><circle cx="125" cy="168" r="22" fill="#64836b"/><g fill="#303832" font-family="sans-serif" font-size="21"><text x="235" y="83">赤 → 黄 → 青緑 → 赤 …</text><text x="235" y="126">3つの状態を順番に巡る</text><text x="235" y="169">色を番号 0・1・2 に対応させると</text><text x="235" y="201">「次はどれ？」を余りで選べる</text></g><text x="320" y="239" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#657367">信号の色を簡略化した学習用イラスト</text></svg>