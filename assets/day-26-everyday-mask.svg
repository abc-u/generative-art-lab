<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">机の写真に付箋と色鉛筆で注目場所を示す例</title><desc id="d">机の上の写真の左側には輪郭を拾う青い付箋、右側には影を深く描く赤い印を重ね、手で場所ごとの見方を指定する。</desc><rect width="900" height="430" rx="22" fill="#f3efe5"/><rect x="105" y="62" width="690" height="295" rx="12" fill="#d5e4e2" stroke="#745e4b" stroke-width="8"/><rect x="134" y="91" width="632" height="194" fill="#90adb0"/><path d="M134 241q120-104 235-26t210-25q84-59 187 29v66H134z" fill="#657f6f"/><path d="M134 267q140-70 269-10t363-11v39H134z" fill="#d5b78c"/><circle cx="562" cy="173" r="45" fill="#f2d796"/><rect x="204" y="102" width="126" height="52" rx="6" fill="#eef7fb" opacity=".92"/><text x="220" y="135" font-family="sans-serif" font-size="17" fill="#2e6474">輪郭を見たい</text><path d="M188 175q60-35 115 2" fill="none" stroke="#4f9ba8" stroke-width="12" stroke-linecap="round" opacity=".8"/><path d="M606 230q55 30 102-8" fill="none" stroke="#bc664e" stroke-width="24" stroke-linecap="round" opacity=".75"/><text x="611" y="278" font-family="sans-serif" font-size="17" fill="#fff">影を濃く</text><rect x="315" y="316" width="263" height="30" rx="15" fill="#b98b67"/><text x="42" y="397" font-family="sans-serif" font-size="19" fill="#29383d">見せたい所に手で色を重ねると、描画ルールの重点もそこへ集まる</text></svg>