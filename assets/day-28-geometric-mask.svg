<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">距離から楕円マスクを作る</title><desc id="d">楕円の内側は白く通し、ぼかし帯は灰色、外側は黒く止める。中心から候補点への距離を半径で割る。</desc><rect width="720" height="360" rx="24" fill="#f5f0e6"/><text x="30" y="46" font-size="25" font-family="sans-serif" fill="#29383d">距離 q で許可率を決める</text><ellipse cx="210" cy="195" rx="145" ry="100" fill="#d4d5cb" stroke="#c2543d" stroke-width="4"/><ellipse cx="210" cy="195" rx="112" ry="74" fill="white"/><circle cx="210" cy="195" r="7" fill="#c2543d"/><line x1="210" y1="195" x2="355" y2="195" stroke="#29383d" stroke-width="3"/><circle cx="369" cy="195" r="7" fill="#c2543d"/><text x="250" y="183" font-size="19" font-family="sans-serif">候補点 q=1.1</text><text x="164" y="222" font-size="17" font-family="sans-serif">中心</text><text x="405" y="110" font-size="20" font-family="sans-serif" fill="#29383d">白：内側 mask=1</text><text x="405" y="155" font-size="20" font-family="sans-serif" fill="#29383d">灰：境界 mask=0〜1</text><text x="405" y="200" font-size="20" font-family="sans-serif" fill="#29383d">黒：外側 mask=0</text><text x="405" y="270" font-size="19" font-family="sans-serif" fill="#29383d">q=1.1、幅0.2なら</text><text x="405" y="302" font-size="24" font-family="sans-serif" fill="#c2543d">mask=0.5</text><text x="30" y="335" font-size="17" font-family="sans-serif" fill="#53676c">p最終 = mask × p基本</text></svg>