<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">描いたマスクの濃さを暗さの重みに使う</title><desc id="d">マスクの濃度が0の場所は輪郭だけ、75パーセントの場所は暗さ75パーセントと輪郭25パーセント、100パーセントの場所は暗さだけを使って筆跡確率を決める。</desc><rect width="900" height="340" rx="24" fill="#f4f0e7"/><text x="42" y="54" font-family="sans-serif" font-size="25" font-weight="700" fill="#29383d">手で塗ったマスクの濃さ → その場所の重み α</text><rect x="52" y="92" width="230" height="94" rx="12" fill="#52666a"/><text x="77" y="132" font-family="sans-serif" font-size="20" fill="#fff">α=0</text><text x="77" y="162" font-family="sans-serif" font-size="17" fill="#fff">輪郭を優先</text><rect x="335" y="92" width="230" height="94" rx="12" fill="#b4b4b4"/><text x="360" y="132" font-family="sans-serif" font-size="20" fill="#29383d">α≈0.75</text><text x="360" y="162" font-family="sans-serif" font-size="17" fill="#29383d">暗さ75%＋輪郭25%</text><rect x="618" y="92" width="230" height="94" rx="12" fill="#262b2d"/><text x="643" y="132" font-family="sans-serif" font-size="20" fill="#fff">α=1</text><text x="643" y="162" font-family="sans-serif" font-size="17" fill="#fff">暗さを優先</text><path d="M280 138h50m-5-8 8 8-8 8m225-8h50m-5-8 8 8-8 8" fill="none" stroke="#b86b4d" stroke-width="4"/><rect x="52" y="224" width="796" height="72" rx="14" fill="#fff"/><text x="74" y="256" font-family="sans-serif" font-size="18" fill="#29383d">各位置の α=マスクの明るさ÷255</text><text x="74" y="281" font-family="sans-serif" font-size="17" fill="#52666a">p=α×暗さの確率+(1−α)×輪郭の強さ → 乱数で筆跡を採用</text></svg>