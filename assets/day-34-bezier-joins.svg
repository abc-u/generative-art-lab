<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">二つの二次ベジェ曲線をなめらかにつなぐ</title>
<desc id="desc">左は接続点Jの前後のハンドルが一直線にそろった滑らかな接続、右は向きがずれて角ができた接続。</desc>
<rect width="760" height="300" rx="18" fill="#f5f2ea"/>
<g font-family="sans-serif" fill="#20363b">
<text x="32" y="38" font-size="20" font-weight="700">なめらか：接続点の前後で向きをそろえる</text>
<path d="M35 210 Q135 55 245 150 Q355 245 465 85" fill="none" stroke="#176b72" stroke-width="7" stroke-linecap="round"/>
<path d="M135 55 L245 150 L355 245" fill="none" stroke="#d58b48" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="135" cy="55" r="7" fill="#d58b48"/><circle cx="245" cy="150" r="9" fill="#c64d35"/><circle cx="355" cy="245" r="7" fill="#d58b48"/>
<text x="112" y="43" font-size="17">A₁</text><text x="235" y="177" font-size="17" font-weight="700">J</text><text x="359" y="270" font-size="17">B₁</text>
<text x="32" y="278" font-size="15">J−A₁ と B₁−J が同じ向き → 接線方向が連続</text>
<text x="405" y="38" font-size="20" font-weight="700">角ができる：向きがずれる</text>
<path d="M400 210 Q500 55 610 150 Q690 70 735 230" fill="none" stroke="#a94d37" stroke-width="7" stroke-linecap="round"/>
<path d="M500 55 L610 150 L690 70" fill="none" stroke="#d58b48" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="500" cy="55" r="7" fill="#d58b48"/><circle cx="610" cy="150" r="9" fill="#c64d35"/><circle cx="690" cy="70" r="7" fill="#d58b48"/>
<text x="478" y="43" font-size="17">A₁</text><text x="600" y="177" font-size="17" font-weight="700">J</text><text x="695" y="61" font-size="17">B₁</text>
<text x="405" y="278" font-size="15">端点は同じでも、接線方向が変わると折れ目に見える</text>
</g></svg>