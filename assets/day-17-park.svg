<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t d"><title id="t">木陰の近くほど休む人が多く見える公園の模式図</title><desc id="d">木陰を中心に人が多く、離れるほど人が少ない。場所による密度差の具体例。</desc><rect width="720" height="290" rx="18" fill="#f4f0e6"/><text x="28" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#293c39">身近な例：木陰の近くに人が集まる公園</text><rect x="38" y="62" width="420" height="194" rx="14" fill="#dce8d0" stroke="#84927e" stroke-width="2"/><circle cx="242" cy="148" r="74" fill="#8bab6e"/><rect x="230" y="154" width="24" height="57" rx="5" fill="#82684c"/><g fill="#d16c56"><circle cx="203" cy="148" r="6"/><circle cx="244" cy="121" r="6"/><circle cx="277" cy="164" r="6"/><circle cx="225" cy="188" r="6"/><circle cx="434" cy="94" r="5"/><circle cx="411" cy="232" r="5"/></g><text x="485" y="103" font-family="sans-serif" font-size="16" font-weight="700" fill="#293c39">密度のモデル</text><text x="485" y="133" font-family="sans-serif" font-size="14" fill="#48544b">場所により出現確率が変わる。</text><text x="485" y="184" font-family="sans-serif" font-size="14" fill="#48544b">実際の人の行動は天候や</text><text x="485" y="207" font-family="sans-serif" font-size="14" fill="#48544b">混雑など多くの要因によります。</text><text x="485" y="247" font-family="sans-serif" font-size="13" fill="#48544b">位置関係を示す模式図です。</text></svg>