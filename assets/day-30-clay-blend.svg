<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">二つの粘土玉を押しつけてつなぐ</title><desc id="d">赤い粘土玉と青い粘土玉の接点が紫色のなめらかな橋でつながり、一つの塊になるオリジナル図。</desc><rect width="900" height="430" rx="24" fill="#f5f0e6"/><text x="32" y="52" font-family="sans-serif" font-size="27" fill="#29383d">粘土玉を押しつけると、境目が橋になる</text><path d="M125 245 C125 163 185 112 270 112 C333 112 367 160 404 185 C441 160 477 112 540 112 C625 112 685 163 685 245 C685 320 625 355 540 355 C477 355 441 320 404 295 C367 320 333 355 270 355 C185 355 125 320 125 245Z" fill="#aa758f"/><circle cx="270" cy="235" r="98" fill="#c95849"/><circle cx="540" cy="235" r="98" fill="#4e8290"/><path d="M347 190 C375 207 389 209 404 209 C419 209 433 207 461 190 L461 280 C433 263 419 261 404 261 C389 261 375 263 347 280Z" fill="#8f6989"/><text x="228" y="240" font-family="sans-serif" font-size="20" fill="white">玉A</text><text x="500" y="240" font-family="sans-serif" font-size="20" fill="white">玉B</text><line x1="404" y1="145" x2="404" y2="83" stroke="#29383d" stroke-width="3"/><text x="323" y="77" font-family="sans-serif" font-size="18" fill="#29383d">なめらかな橋</text><text x="33" y="395" font-family="sans-serif" font-size="18" fill="#53676c">自作図：接点を混ぜて一体に見せる粘土の例</text></svg>