<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250"><rect width="520" height="250" rx="20" fill="#f4f0e6"/><text x="25" y="34" font-family="sans-serif" font-size="18" fill="#303832">中心(4,4) → 点(7,4)</text><line x1="100" y1="175" x2="350" y2="175" stroke="#536354" stroke-width="3"/><circle cx="100" cy="175" r="8" fill="#cf684b"/><circle cx="350" cy="175" r="8" fill="#347a91"/><text x="100" y="210" text-anchor="middle" font-size="15" font-family="sans-serif">中心</text><text x="350" y="210" text-anchor="middle" font-size="15" font-family="sans-serif">点</text><text x="225" y="160" text-anchor="middle" font-size="16" font-family="sans-serif">横に3マス・縦に0</text><text x="260" y="240" text-anchor="middle" font-size="16" font-family="sans-serif">距離 = √(3² + 0²) = 3マス</text></svg>