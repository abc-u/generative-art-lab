<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">水面の波の縁に筆跡が集まる例</title><desc id="desc">波と静かな水面の境目には短い線を多く置き、平坦な水面には少なく置く模式図。</desc><rect width="900" height="430" rx="24" fill="#f3f0e6"/><path d="M45 105 Q150 75 255 105 T465 105 V345 H45 Z" fill="#d3e4d8"/><path d="M465 105 Q570 75 675 105 T885 105 V345 H465 Z" fill="#79b5bd"/><path d="M45 105 Q150 75 255 105 T465 105 Q570 75 675 105 T885 105" fill="none" stroke="#245e69" stroke-width="5"/><g stroke="#2b6d77" stroke-width="7" stroke-linecap="round"><path d="M95 145 h18"/><path d="M145 167 h18"/><path d="M195 144 h18"/><path d="M245 166 h18"/><path d="M295 145 h18"/><path d="M345 166 h18"/><path d="M395 145 h18"/><path d="M500 146 h18"/><path d="M545 166 h18"/><path d="M590 144 h18"/><path d="M635 166 h18"/><path d="M680 145 h18"/><path d="M725 166 h18"/><path d="M770 144 h18"/><path d="M815 166 h18"/></g><g fill="#233f49"><circle cx="115" cy="243" r="5"/><circle cx="245" cy="277" r="5"/><circle cx="355" cy="230" r="5"/><circle cx="550" cy="270" r="5"/><circle cx="740" cy="245" r="5"/></g><text x="245" y="210" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#293d43">波の縁：変化が強い</text><text x="675" y="210" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#293d43">水面：変化が小さい</text><text x="450" y="390" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#40575d">境界には筆跡を多く、平坦な面には間をあける</text></svg>