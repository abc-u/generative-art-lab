<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t d"><title id="t">行番号と列番号の合計で形を選ぶ</title><desc id="d">2行2列の格子。合計が偶数なら円、奇数なら四角。</desc><rect width="720" height="370" rx="8" fill="#f4f6f2"/><g font-family="sans-serif" fill="#303832"><text x="28" y="38" font-size="17" font-weight="700" fill="#4f8a5c">row + col の合計を調べる</text><g transform="translate(86 88)"><rect width="220" height="220" fill="#fff" stroke="#cbd7ce"/><path d="M110 0v220M0 110h220" stroke="#cbd7ce"/><rect x="2" y="2" width="106" height="106" fill="#e5eee5"/><rect x="112" y="112" width="106" height="106" fill="#e5eee5"/><circle cx="55" cy="55" r="23" fill="#cf684b"/><rect x="133" y="23" width="64" height="64" fill="#4c6854"/><rect x="23" y="133" width="64" height="64" fill="#4c6854"/><circle cx="165" cy="165" r="23" fill="#cf684b"/></g><g font-size="15"><text x="355" y="112">0 + 0 = 0 → 偶数 → 円</text><text x="355" y="157">0 + 1 = 1 → 奇数 → 四角</text><text x="355" y="220">1 + 0 = 1 → 奇数 → 四角</text><text x="355" y="265">1 + 1 = 2 → 偶数 → 円</text></g><text x="355" y="320" font-size="14" fill="#58645b">対角のマスでは、合計の偶奇が同じ。</text></g></svg>
