<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img"><rect width="780" height="310" rx="22" fill="#f7f3e9"/><text x="34" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#20363b">tを進め、曲線上の点を記録する</text><line x1="80" y1="225" x2="390" y2="55" stroke="#9aa8a2" stroke-width="2" stroke-dasharray="8 7"/><line x1="390" y1="55" x2="700" y2="225" stroke="#9aa8a2" stroke-width="2" stroke-dasharray="8 7"/><path d="M80 225 Q390 55 700 225" fill="none" stroke="#287f82" stroke-width="5"/><g fill="#fff" stroke="#20363b" stroke-width="3"><circle cx="80" cy="225" r="9"/><circle cx="390" cy="55" r="9"/><circle cx="700" cy="225" r="9"/></g><text x="58" y="260" font-family="sans-serif" font-size="18" fill="#20363b">P₀ 始点</text><text x="404" y="59" font-family="sans-serif" font-size="18" fill="#20363b">P₁ 制御点</text><text x="661" y="260" font-family="sans-serif" font-size="18" fill="#20363b">P₂ 終点</text><g fill="#db7651" stroke="#fff" stroke-width="2"><circle cx="80" cy="225" r="7"/><circle cx="235" cy="161.25" r="7"/><circle cx="390" cy="140" r="7"/><circle cx="545" cy="161.25" r="7"/><circle cx="700" cy="225" r="7"/></g><rect x="48" y="77" width="203" height="49" rx="10" fill="#fff" stroke="#d5d8cf"/><text x="61" y="99" font-family="sans-serif" font-size="15" fill="#20363b">t=0 → P₀</text><text x="61" y="118" font-family="sans-serif" font-size="15" fill="#20363b">t=0.5 → 曲線の中央</text><rect x="526" y="69" width="212" height="43" rx="10" fill="#fff" stroke="#d5d8cf"/><text x="542" y="96" font-family="sans-serif" font-size="15" fill="#20363b">N分割 → N+1個の点</text></svg>